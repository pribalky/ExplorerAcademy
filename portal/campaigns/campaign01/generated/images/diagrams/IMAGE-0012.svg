<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Station Water System Diagram">
  <rect width="800" height="600" fill="#FBF8F2"/>
  <g font-family="sans-serif" font-size="20" fill="#2C3E50" text-anchor="middle">
    <g stroke="#2C3E50" stroke-width="3" fill="none">
      <rect x="60" y="80" width="140" height="60"/>
      <rect x="330" y="80" width="140" height="60"/>
      <rect x="600" y="80" width="140" height="60"/>
      <rect x="600" y="280" width="140" height="60"/>
      <rect x="330" y="280" width="140" height="60"/>
      <rect x="60" y="280" width="140" height="60"/>
      <rect x="330" y="460" width="140" height="60"/>
    </g>
    <text x="130" y="115">Intake</text>
    <text x="400" y="115">Filter</text>
    <text x="670" y="115">Storage Tank</text>
    <text x="670" y="315">Pump</text>
    <text x="400" y="315">Distribution</text>
    <text x="130" y="315">Recycling Unit</text>
