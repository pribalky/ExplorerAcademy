<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example Investigation Board">
  <rect width="800" height="600" fill="#FBF8F2"/>

  <g fill="none" stroke="#2C3E50" stroke-width="2">
    <rect x="80" y="80" width="140" height="90"/>
    <rect x="580" y="80" width="140" height="90"/>
    <rect x="80" y="420" width="140" height="90"/>
    <rect x="580" y="420" width="140" height="90"/>
    <circle cx="400" cy="300" r="50"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#2C3E50" text-anchor="middle">
    <text x="150" y="130">Log fragment</text>
    <text x="650" y="130">Weather chart</text>
    <text x="150" y="470">Sample jar</text>
    <text x="650" y="470">Bridge sketch</text>
    <text x="400" y="296">Conclusion</text>
    <text x="400" y="316">card</text>
  </g>

  <g stroke="#C97C3D" stroke-width="2">
    <line x1="220" y1="150" x2="360" y2="280"/>
    <line x1="580" y1="150" x2="440" y2="280"/>
    <line x1="220" y1="440" x2="360" y2="320"/>
    <line x1="580" y1="440" x2="440" y2="320"/>
  </g>
</svg>
