<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Name in the Static">
  <rect width="800" height="450" fill="#161D24"/>
  <!-- terminal frame -->
  <rect x="150" y="70" width="500" height="310" rx="10" fill="#0F1519" stroke="#4A5A63" stroke-width="6"/>
  <rect x="175" y="95" width="450" height="260" fill="#0A0F13"/>

  <!-- static noise -->
  <g opacity="0.5">
    <rect x="190" y="110" width="6" height="6" fill="#4FB3B3"/>
    <rect x="230" y="140" width="4" height="10" fill="#9AA5AC"/>
    <rect x="300" y="120" width="8" height="4" fill="#4FB3B3"/>
    <rect x="360" y="160" width="5" height="7" fill="#9AA5AC"/>
    <rect x="420" y="130" width="7" height="5" fill="#4FB3B3"/>
    <rect x="480" y="150" width="4" height="9" fill="#9AA5AC"/>
    <rect x="540" y="115" width="6" height="6" fill="#4FB3B3"/>
    <rect x="580" y="145" width="5" height="8" fill="#9AA5AC"/>
    <rect x="210" y="290" width="6" height="6" fill="#4FB3B3"/>
    <rect x="270" y="310" width="7" height="5" fill="#9AA5AC"/>
    <rect x="340" y="295" width="5" height="9" fill="#4FB3B3"/>
    <rect x="410" y="305" width="6" height="6" fill="#9AA5AC"/>
    <rect x="470" y="290" width="8" height="4" fill="#4FB3B3"/>
    <rect x="530" y="308" width="5" height="7" fill="#9AA5AC"/>
  </g>

  <!-- partially legible name -->
  <text x="400" y="235" text-anchor="middle" font-family="monospace" font-size="42" fill="#4FB3B3" opacity="0.9">E. QU_NN</text>
  <line x1="230" y1="200" x2="570" y2="200" stroke="#9AA5AC" stroke-width="2" opacity="0.4"/>
  <line x1="230" y1="260" x2="570" y2="260" stroke="#9AA5AC" stroke-width="2" opacity="0.4"/>

  <!-- scanlines -->
  <g stroke="#4FB3B3" stroke-width="1" opacity="0.15">
    <line x1="175" y1="130" x2="625" y2="130"/>
    <line x1="175" y1="170" x2="625" y2="170"/>
    <line x1="175" y1="210" x2="625" y2="210"/>
    <line x1="175" y1="250" x2="625" y2="250"/>
    <line x1="175" y1="290" x2="625" y2="290"/>
    <line x1="175" y1="330" x2="625" y2="330"/>
  </g>
</svg>
