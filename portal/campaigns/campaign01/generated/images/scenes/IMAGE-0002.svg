<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arrival at Outpost Echo">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E4C1"/>
      <stop offset="1" stop-color="#E8A87C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky2)"/>
  <rect x="0" y="330" width="800" height="120" fill="#A9946B"/>

  <!-- distant hills -->
  <path d="M0 330 Q150 290 300 330 T800 320 V450 H0 Z" fill="#C9A97E" opacity="0.6"/>

  <!-- station body -->
  <rect x="230" y="200" width="340" height="140" fill="#8B7355"/>
  <rect x="230" y="200" width="340" height="14" fill="#5E4B3C"/>
  <rect x="270" y="230" width="50" height="50" fill="#4A5A63"/>
  <rect x="360" y="230" width="50" height="50" fill="#4A5A63"/>
  <rect x="450" y="230" width="50" height="50" fill="#4A5A63"/>
  <!-- door ajar -->
  <rect x="500" y="250" width="40" height="90" fill="#5E4B3C"/>
  <rect x="500" y="250" width="10" height="90" fill="#2C2016"/>

  <!-- antenna -->
  <line x1="480" y1="200" x2="480" y2="140" stroke="#5E4B3C" stroke-width="4"/>
  <circle cx="480" cy="136" r="6" fill="#5E4B3C"/>

  <!-- learner approaching, small, foreground -->
  <g>
    <ellipse cx="150" cy="420" rx="18" ry="6" fill="#000" opacity="0.2"/>
    <path d="M138 420 Q138 380 150 372 Q162 380 162 420 Z" fill="#3D2E22"/>
    <circle cx="150" cy="362" r="11" fill="#3D2E22"/>
  </g>
</svg>
