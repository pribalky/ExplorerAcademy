<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Graduation Day">
  <defs>
    <linearGradient id="room24" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5A63"/>
      <stop offset="1" stop-color="#8B7355"/>
    </linearGradient>
    <radialGradient id="glow24" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#E8A73E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8A73E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#room24)"/>
  <rect x="0" y="380" width="800" height="70" fill="#3D2E22"/>
  <ellipse cx="400" cy="330" rx="280" ry="70" fill="url(#glow24)"/>

  <!-- echo of IMAGE-0001's round table, same position -->
  <ellipse cx="400" cy="345" rx="120" ry="22" fill="#5E4B3C"/>

  <!-- Director Orion, left, presenting certificate -->
  <g>
    <ellipse cx="290" cy="340" rx="34" ry="10" fill="#000" opacity="0.25"/>
    <path d="M270 340 Q270 270 290 260 Q310 270 310 340 Z" fill="#3D2E22"/>
    <circle cx="290" cy="245" r="20" fill="#3D2E22"/>
  </g>
  <rect x="330" y="300" width="60" height="42" rx="3" fill="#EDE3D0" stroke="#E8A73E" stroke-width="3"/>

  <!-- Learner, right, receiving -->
  <g>
    <ellipse cx="510" cy="345" rx="30" ry="9" fill="#000" opacity="0.25"/>
    <path d="M493 345 Q493 285 510 276 Q527 285 527 345 Z" fill="#4A3728"/>
    <circle cx="510" cy="262" r="17" fill="#4A3728"/>
  </g>

  <!-- Atlas in background -->
  <g opacity="0.85">
    <rect x="620" y="300" width="40" height="56" rx="8" fill="#4FB3B3"/>
    <circle cx="640" cy="288" r="14" fill="#4FB3B3"/>
  </g>

  <!-- warm celebratory windows -->
  <rect x="60" y="90" width="60" height="90" rx="4" fill="#E8A73E" opacity="0.5"/>
  <rect x="680" y="90" width="60" height="90" rx="4" fill="#E8A73E" opacity="0.5"/>
</svg>
