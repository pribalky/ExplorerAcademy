<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An Independent Investigation">
  <rect width="800" height="600" fill="#8B7355"/>
  <rect x="60" y="120" width="680" height="380" fill="#9C8262"/>

  <!-- generic notebook -->
  <rect x="150" y="220" width="180" height="130" rx="4" fill="#EDE3D0" stroke="#5E4B3C" stroke-width="3"/>
  <line x1="170" y1="250" x2="310" y2="250" stroke="#8B7355" stroke-width="3"/>
  <line x1="170" y1="275" x2="310" y2="275" stroke="#8B7355" stroke-width="3"/>

  <!-- ruler -->
  <rect x="380" y="240" width="200" height="20" rx="3" fill="#E8A73E"/>

  <!-- generic containers -->
  <rect x="420" y="300" width="40" height="55" rx="6" fill="#4FB3B3" opacity="0.8"/>
  <rect x="480" y="310" width="40" height="45" rx="6" fill="#9AA5AC"/>

  <!-- torch -->
  <rect x="560" y="300" width="80" height="26" rx="8" fill="#5E4B3C"/>
  <circle cx="648" cy="313" r="14" fill="#E8A73E" opacity="0.8"/>

  <!-- hands arranging (simple shapes, no specific experiment) -->
  <g fill="#3D2E22">
    <ellipse cx="330" cy="380" rx="30" ry="16" transform="rotate(-10 330 380)"/>
    <ellipse cx="470" cy="385" rx="28" ry="15" transform="rotate(8 470 385)"/>
  </g>
</svg>
