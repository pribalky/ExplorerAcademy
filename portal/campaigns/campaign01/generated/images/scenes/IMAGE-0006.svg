<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Strange Footprints">
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E4C1"/>
      <stop offset="1" stop-color="#E8A87C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky6)"/>
  <rect x="0" y="260" width="800" height="190" fill="#A9946B"/>

  <!-- treeline -->
  <g fill="#5E6B4E" opacity="0.7">
    <path d="M600 260 L630 190 L660 260 Z"/>
    <path d="M650 260 L685 170 L720 260 Z"/>
    <path d="M700 260 L730 200 L760 260 Z"/>
  </g>

  <!-- station edge, left -->
  <rect x="0" y="230" width="140" height="40" fill="#8B7355"/>

  <!-- ambiguous footprint trail -->
  <g fill="#5E4B3C" opacity="0.55">
    <ellipse cx="220" cy="320" rx="16" ry="24" transform="rotate(-10 220 320)"/>
    <ellipse cx="270" cy="300" rx="14" ry="22" transform="rotate(8 270 300)"/>
    <ellipse cx="330" cy="285" rx="15" ry="23" transform="rotate(-6 330 285)"/>
    <ellipse cx="395" cy="270" rx="14" ry="21" transform="rotate(10 395 270)"/>
    <ellipse cx="460" cy="258" rx="13" ry="20" transform="rotate(-8 460 258)"/>
    <ellipse cx="525" cy="250" rx="12" ry="18" transform="rotate(6 525 250)"/>
  </g>
</svg>
