<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Restarting the Weather Station">
  <defs>
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE3E8"/>
      <stop offset="1" stop-color="#F4E4C1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky7)"/>
  <rect x="0" y="330" width="800" height="120" fill="#8B9A5B"/>

  <!-- instrument shelter -->
  <rect x="330" y="230" width="140" height="100" fill="#EDE3D0" stroke="#9AA5AC" stroke-width="4"/>
  <g stroke="#9AA5AC" stroke-width="3">
    <line x1="330" y1="250" x2="470" y2="250"/>
    <line x1="330" y1="270" x2="470" y2="270"/>
    <line x1="330" y1="290" x2="470" y2="290"/>
    <line x1="330" y1="310" x2="470" y2="310"/>
  </g>
  <rect x="380" y="180" width="40" height="50" fill="#9AA5AC"/>
  <!-- wind vane -->
  <line x1="400" y1="180" x2="400" y2="140" stroke="#5E4B3C" stroke-width="4"/>
  <path d="M400 140 L430 150 L400 160 Z" fill="#C97C3D"/>
  <!-- legs -->
  <rect x="345" y="330" width="10" height="30" fill="#5E4B3C"/>
  <rect x="445" y="330" width="10" height="30" fill="#5E4B3C"/>

  <!-- learner adjusting -->
  <g>
    <ellipse cx="270" cy="378" rx="24" ry="8" fill="#000" opacity="0.2"/>
    <path d="M255 378 Q255 320 272 312 Q289 320 289 378 Z" fill="#3D2E22"/>
    <circle cx="272" cy="300" r="15" fill="#3D2E22"/>
  </g>
</svg>
