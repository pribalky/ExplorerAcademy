<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example Geological Field Sketch">
  <rect width="800" height="600" fill="#FBF8F2"/>

  <!-- cross-section layers -->
  <g stroke="#2C3E50" stroke-width="2" fill="none">
    <path d="M40 200 Q400 170 760 210"/>
    <path d="M40 260 Q400 230 760 270"/>
    <path d="M40 340 Q400 320 760 350"/>
    <path d="M40 430 Q400 410 760 440"/>
    <path d="M40 520 Q400 500 760 530"/>
  </g>

  <!-- surface feature: small outcrop -->
  <path d="M300 200 Q330 160 380 200" stroke="#2C3E50" stroke-width="2" fill="none"/>

  <g font-family="sans-serif" font-size="18" fill="#2C3E50">
    <text x="60" y="235">Topsoil</text>
    <text x="60" y="300">Sandstone</text>
    <text x="60" y="385">Shale</text>
    <text x="60" y="475">Limestone</text>
    <text x="500" y="200">Outcrop</text>
  </g>

  <!-- scale bar -->
  <g stroke="#2C3E50" stroke-width="2">
    <line x1="620" y1="560" x2="740" y2="560"/>
    <line x1="620" y1="552" x2="620" y2="568"/>
    <line x1="740" y1="552" x2="740" y2="568"/>
  </g>
  <text x="680" y="585" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2C3E50">1 metre</text>
</svg>
