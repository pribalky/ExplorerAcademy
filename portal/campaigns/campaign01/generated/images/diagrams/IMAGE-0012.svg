    <path d="M470 110 H600"/>
    <path d="M670 140 V280"/>
    <path d="M600 310 H470"/>
    <path d="M330 310 H200"/>
    <path d="M130 280 V200 Q130 160 200 140 Q260 120 330 110"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2C3E50"/>
    </marker>
  </defs>
</svg>
