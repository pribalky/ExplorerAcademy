<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Unlocked Archive">
  <rect width="800" height="450" fill="#1B2530"/>

  <!-- vault door, open -->
  <rect x="60" y="60" width="200" height="330" rx="10" fill="#4A5A63" stroke="#22303D" stroke-width="6" transform="rotate(-22 160 225)"/>
  <circle cx="240" cy="225" r="18" fill="#9AA5AC" transform="rotate(-22 160 225)"/>

  <!-- shelves of files -->
  <g fill="#8B7355">
    <rect x="320" y="90" width="440" height="20"/>
    <rect x="320" y="180" width="440" height="20"/>
    <rect x="320" y="270" width="440" height="20"/>
  </g>
  <g fill="#EDE3D0" stroke="#9AA5AC" stroke-width="1">
    <rect x="335" y="60" width="14" height="30"/>
    <rect x="355" y="55" width="14" height="35"/>
    <rect x="375" y="62" width="14" height="28"/>
    <rect x="395" y="58" width="14" height="32"/>
    <rect x="335" y="150" width="14" height="30"/>
    <rect x="355" y="145" width="14" height="35"/>
    <rect x="375" y="152" width="14" height="28"/>
    <rect x="395" y="148" width="14" height="32"/>
  </g>

  <!-- glowing terminal, foreground -->
  <rect x="470" y="300" width="180" height="110" rx="8" fill="#2C3E50" stroke="#4A5A63" stroke-width="5"/>
  <rect x="490" y="315" width="140" height="70" fill="#0F1519"/>
  <rect x="500" y="325" width="80" height="8" fill="#4FB3B3"/>
  <rect x="500" y="340" width="110" height="8" fill="#4FB3B3" opacity="0.7"/>
  <rect x="500" y="355" width="60" height="8" fill="#4FB3B3" opacity="0.5"/>
</svg>
