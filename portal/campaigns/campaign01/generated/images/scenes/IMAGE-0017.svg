<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Signal Tower">
  <defs>
    <linearGradient id="sky17" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8E96"/>
      <stop offset="1" stop-color="#B8C4C8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sky17)"/>
  <rect x="0" y="700" width="600" height="100" fill="#8B9A5B"/>

  <!-- tower structure -->
  <g stroke="#4A5A63" stroke-width="6" fill="none">
    <line x1="240" y1="700" x2="300" y2="120"/>
    <line x1="360" y1="700" x2="300" y2="120"/>
    <line x1="255" y1="600" x2="345" y2="600"/>
    <line x1="262" y1="480" x2="338" y2="480"/>
    <line x1="270" y1="360" x2="330" y2="360"/>
    <line x1="278" y1="240" x2="322" y2="240"/>
    <line x1="240" y1="700" x2="345" y2="600"/>
    <line x1="360" y1="700" x2="255" y2="600"/>
    <line x1="255" y1="600" x2="338" y2="480"/>
    <line x1="345" y1="600" x2="262" y2="480"/>
    <line x1="262" y1="480" x2="330" y2="360"/>
    <line x1="338" y1="480" x2="270" y2="360"/>
  </g>

  <!-- cabling -->
  <path d="M300 120 Q260 300 280 480" stroke="#4FB3B3" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- access panel open near base -->
  <rect x="260" y="620" width="60" height="60" rx="4" fill="#22303D"/>
  <rect x="316" y="628" width="18" height="46" fill="#9AA5AC" transform="rotate(30 316 628)"/>

  <!-- small figure at base -->
  <g>
    <ellipse cx="200" cy="740" rx="14" ry="5" fill="#000" opacity="0.2"/>
    <path d="M190 740 Q190 710 200 704 Q210 710 210 740 Z" fill="#3D2E22"/>
    <circle cx="200" cy="698" r="9" fill="#3D2E22"/>
  </g>
</svg>
